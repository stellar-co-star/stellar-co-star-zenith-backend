{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "zenith-stellar-co-star-zenith-stellar-co-star-zenith-backend.fullname" . }}-api
  labels:
    {{- include "zenith-stellar-co-star-zenith-stellar-co-star-zenith-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "zenith-stellar-co-star-zenith-stellar-co-star-zenith-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
